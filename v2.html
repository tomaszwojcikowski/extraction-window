<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Extraction Window — v2 field</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      html, body {
        width: 100%;
        height: 100%;
        background: var(--ground-deep, #0c1214);
        overflow: hidden;
        font-family: "IBM Plex Mono", "Courier New", monospace;
        color: var(--ink, #dfe4d5);
      }
      #field {
        display: block;
        width: 100%;
        height: 100%;
        image-rendering: pixelated;
        cursor: default;
      }
      #hud {
        position: absolute;
        left: 16px;
        top: 12px;
        right: 16px;
        max-width: 720px;
        pointer-events: none;
        z-index: 2;
      }
      #bars {
        display: flex;
        flex-wrap: wrap;
        gap: 12px 14px;
      }
      .meter { width: 130px; }
      .meter[data-bar="shd"] { width: 110px; }
      .meter[data-bar="eps"] { width: 180px; }
      .meter[data-bar="xp"] { width: 120px; }
      .cap, .val {
        display: block;
        font-size: 10px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--ink-dim, #93a196);
      }
      .val { color: var(--ink, #dfe4d5); margin-top: 2px; }
      .track {
        height: 10px;
        margin: 3px 0 0;
        background: rgba(12, 18, 20, 0.85);
        border: 1px solid rgba(147, 161, 150, 0.35);
      }
      .fill {
        height: 100%;
        width: 0%;
        background: var(--safe, #7cbc88);
        transition: width 140ms ease-out;
      }
      #chips {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        margin: 10px 0 8px;
      }
      .chip {
        font-size: 10px;
        letter-spacing: 0.04em;
        padding: 2px 6px;
        border: 1px solid currentColor;
        background: rgba(12, 18, 20, 0.72);
      }
      #meta, #sector, #obj-campaign, #quest, #urgency, #milestone, #debug {
        font-size: 11px;
        line-height: 1.4;
        color: var(--ink-dim, #93a196);
        white-space: pre-wrap;
      }
      #obj-local {
        font-size: 12px;
        color: var(--ink-bright, #f6f4e6);
        margin-top: 6px;
      }
      #quest { color: var(--tape, #e8b93c); }
      #milestone { color: var(--flag, #e0578f); }
      #debug { margin-top: 6px; color: var(--ink-mute, #647470); }
      #dock {
        position: absolute;
        left: 16px;
        right: 16px;
        bottom: 14px;
        font-size: 11px;
        color: var(--ink, #dfe4d5);
        pointer-events: none;
        z-index: 2;
        text-shadow: 0 1px 0 var(--ground-deep, #0c1214);
      }
      #hint {
        position: absolute;
        left: 16px;
        bottom: 38px;
        max-width: 52ch;
        font-size: 12px;
        line-height: 1.4;
        color: var(--ink, #dfe4d5);
        background: var(--hint-bg, #0c1214ee);
        padding: 7px 10px;
        pointer-events: none;
        z-index: 2;
      }
      #log {
        position: absolute;
        right: 16px;
        bottom: 56px;
        max-width: 42ch;
        font-size: 11px;
        line-height: 1.4;
        white-space: pre-wrap;
        color: var(--ink, #dfe4d5);
        background: rgba(12, 18, 20, 0.88);
        padding: 8px 10px;
        pointer-events: none;
        z-index: 2;
      }
      #modal {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: rgba(12, 18, 20, 0.55);
        z-index: 5;
      }
      #modal[hidden] { display: none; }
      #modal-panel {
        position: relative;
        width: min(560px, calc(100vw - 32px));
        max-height: 80vh;
        overflow: auto;
        background: var(--panel, #243438);
        border: 1px solid rgba(147, 161, 150, 0.35);
        padding: 22px 20px 16px;
      }
      #modal-panel::before {
        content: "";
        position: absolute;
        top: 8px;
        left: 14px;
        width: 96px;
        height: 5px;
        background: var(--accent, var(--tape, #e8b93c));
      }
      #modal[data-kind="kit"] #modal-panel { width: min(548px, calc(100vw - 32px)); }
      #modal[data-short="1"] { --accent: var(--rust, #c0512f); }
      #modal-body {
        font-size: 13px;
        line-height: 17px;
        white-space: pre-wrap;
        color: var(--ink, #dfe4d5);
      }
      #floats {
        position: absolute;
        inset: 0;
        pointer-events: none;
        overflow: hidden;
        z-index: 3;
      }
      .float {
        position: absolute;
        font-size: 11px;
        font-weight: 500;
        letter-spacing: 0.04em;
        text-shadow: 0 0 4px var(--ground-deep, #0c1214), 0 1px 0 var(--ground-deep, #0c1214);
        white-space: nowrap;
        transform: translate(-50%, 0);
      }
      #flash {
        position: absolute;
        inset: 0;
        pointer-events: none;
        opacity: 0;
        z-index: 4;
      }
    </style>
  </head>
  <body>
    <canvas id="field"></canvas>
    <div id="hud">
      <div id="bars">
        <div class="meter" data-bar="hp"><span class="cap"></span><div class="track"><div class="fill"></div></div><span class="val"></span></div>
        <div class="meter" data-bar="shd"><span class="cap"></span><div class="track"><div class="fill"></div></div><span class="val"></span></div>
        <div class="meter" data-bar="eps"><span class="cap"></span><div class="track"><div class="fill"></div></div><span class="val"></span></div>
        <div class="meter" data-bar="xp"><span class="cap"></span><div class="track"><div class="fill"></div></div><span class="val"></span></div>
      </div>
      <div id="chips"></div>
      <p id="meta"></p>
      <p id="sector"></p>
      <p id="obj-local"></p>
      <p id="obj-campaign"></p>
      <p id="quest"></p>
      <p id="urgency"></p>
      <p id="milestone"></p>
      <p id="debug"></p>
    </div>
    <p id="hint" hidden></p>
    <p id="dock"></p>
    <pre id="log" hidden></pre>
    <div id="modal" hidden>
      <div id="modal-panel">
        <pre id="modal-body"></pre>
      </div>
    </div>
    <div id="floats"></div>
    <div id="flash"></div>
    <script type="module" src="/src/v2/main.ts"></script>
  </body>
</html>
