<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Extraction Window — v2 field</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      html, body {
        width: 100%;
        height: 100%;
        background: var(--ground-deep, #0c1214);
        overflow: hidden;
        font-family: "IBM Plex Mono", "Courier New", monospace;
        color: var(--ink, #dfe4d5);
      }
      #field {
        display: block;
        width: 100%;
        height: 100%;
        image-rendering: pixelated;
        cursor: grab;
      }
      #field:active { cursor: grabbing; }
      #hud {
        position: absolute;
        left: 16px;
        top: 16px;
        right: 16px;
        max-width: 640px;
        pointer-events: none;
      }
      #hud h1 {
        font-size: 13px;
        font-weight: 500;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--tape, #e8b93c);
        margin-bottom: 6px;
      }
      #note, #status, .hint {
        font-size: 11px;
        line-height: 1.45;
        color: var(--ink-dim, #93a196);
        max-width: 62ch;
      }
      #note { margin: 8px 0 6px; color: var(--safe, #7cbc88); }
      .hint { color: var(--ink-mute, #647470); }
      #floats {
        position: absolute;
        inset: 0;
        pointer-events: none;
        overflow: hidden;
      }
      .float {
        position: absolute;
        font-size: 11px;
        font-weight: 500;
        letter-spacing: 0.04em;
        text-shadow: 0 0 4px var(--ground-deep, #0c1214), 0 1px 0 var(--ground-deep, #0c1214);
        white-space: nowrap;
        transform: translate(-50%, 0);
      }
      #flash {
        position: absolute;
        inset: 0;
        pointer-events: none;
        opacity: 0;
      }
    </style>
  </head>
  <body>
    <canvas id="field"></canvas>
    <div id="hud">
      <h1>v2 slice 2 — orbit field</h1>
      <p id="note">Constrained 3/4 camera, sim flood tint, threat paints, floats, lamp carry. No bloom.</p>
      <p id="status"></p>
      <p class="hint">WASD move · . wait · Enter hatch · [ ] sector · R new seed · drag to orbit</p>
    </div>
    <div id="floats"></div>
    <div id="flash"></div>
    <script type="module" src="/src/v2/main.ts"></script>
  </body>
</html>
