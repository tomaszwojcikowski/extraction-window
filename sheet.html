<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Enemy silhouette sheet</title>
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        background: #0c1214;
        color: #dfe4d5;
        font-family: "IBM Plex Mono", monospace;
        padding: 16px;
      }
      #sheet { display: flex; flex-wrap: wrap; gap: 10px; }
      .cell {
        width: 150px;
        background: #121a1c;
        border: 1px solid #36464a;
        padding: 6px;
        text-align: center;
      }
      .cell canvas { image-rendering: pixelated; background: #182124; }
      .name { font-size: 11px; margin-top: 4px; }
      .meta { font-size: 9px; color: #93a196; }
      #game { margin-top: 20px; }
      #game canvas { image-rendering: pixelated; }
    </style>
  </head>
  <body>
    <div id="sheet"></div>
    <div id="game"></div>
    <script type="module" src="/src/sheet.ts"></script>
  </body>
</html>
